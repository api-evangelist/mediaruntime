aid: mediaruntime
name: MediaRuntime
description: >-
  MediaRuntime is a media-processing API. The published contract is an OpenAPI 3.1 document of 17
  paths, 20 operations and 72 schemas served from mediaruntime.com, with two credential types —
  a production API key and a separate sandbox token, so callers can exercise the surface without
  touching production.
