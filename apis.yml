aid: mediaruntime

name: MediaRuntime

image: https://mediaruntime.com/og-image.png

description: 'MediaRuntime provides a comprehensive media-processing platform offering video transcoding, audio extraction, content moderation,
  and analytics through a unified API. It supports production and sandbox environments, enabling developers to integrate media workflows, manage
  processing recipes, and receive webhook notifications for job completions. The service is built for scalability and security, catering to enterprises
  and developers needing reliable media handling.

  of 17 paths, 20 operations and 72 schemas served from mediaruntime.com, with two credential types — a production API key and a separate sandbox
  token, so callers can exercise the surface without touching production.'

