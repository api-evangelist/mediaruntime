aid: mediaruntime

name: MediaRuntime

image: https://mediaruntime.com/og-image.png

description: 'MediaRuntime is an asynchronous media-processing API and hosted sticker runtime for server-side applications, served at
  https://mediaruntime.com/v1. It publishes two products in its apis.json. The Media API takes video, audio and image jobs (POST /v1/jobs) and
  returns canonical ZIP bundles through polling or signed terminal webhooks, with presets and account-scoped recipes, moderation verdicts, analysis
  reports, upload targets and watermarks. The Stickers API configures sticker collections, discovers enabled Hosted Packs, searches stable sticker
  metadata and resolves short-lived approved asset URLs. The OpenAPI 3.1 contract at https://mediaruntime.com/openapi.json describes 33 paths and
  41 operations. Server requests authenticate with an X-API-Key workspace key, and a public sandbox session is available. Official tools are the
  @mediaruntime/node SDK and @mediaruntime/cli on npm, the mediaruntime Python SDK on PyPI, and a GitHub quickstarts repository.'

