  note: 'Submitted via apis.io/add on 2026-08-26 and auto-published by the gate at rating 63 (strong). THE GATE SCORED IT 63 ON A CATCH-ALL. The
    submitted APIs.json at https://mediaruntime.com/apis.json returns HTTP 200, but it is byte-identical to an invented control path — the host
    answers any unknown URL with the same page. /llms.txt is the same page again. Neither document exists. The listing stands because /openapi.json
    IS real: distinct from the catch-all, valid JSON, OpenAPI 3.1 with 17 paths, 20 operations and 72 schemas, declaring both a ProductionApiKey
    and a SandboxToken. Only the declared pointers were false, not the API. Same shape as SendHQ on 2026-08-24, and the same lesson: on a soft-200
    host a 200 proves nothing, so every artifact here was size- and content-checked against the control before being recorded. Nothing is recorded
    for apis.json or llms.txt, because recording a placeholder page under those types would credit machine-readable artifacts that do not exist.'

