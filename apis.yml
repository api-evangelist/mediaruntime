name: MediaRuntime
description: MediaRuntime provides asynchronous video, audio, and image processing, including transcoding, clipping,
  transcripts, moderation, and watermarking, plus collection-scoped hosted sticker discovery and delivery. Its two
  product surfaces share a provider-published OpenAPI 3.1 contract. Production media jobs use an API key; bounded
  sandbox jobs use a separate ephemeral token.
