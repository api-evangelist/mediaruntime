      - jobs
      title: JobListResponse
      type: object
    ImageFormat:
      enum:
      - jpg
      - png
      - webp
      - avif
      title: ImageFormat
      type: string
    JobSummary:
      description: 'One row of GET /v1/jobs.


        Deliberately lighter than JobStatusResponse: no bundle download URL. Those embed a

        job-scoped token, and handing out a page of them is both bulky and needlessly broad —

        fetch GET /v1/jobs/{job_id} for the one you actually want to download.'
      properties:
        amount_cents:
          anyOf:
          - type: integer
          - type: 'null'
          title: Amount Cents
        bundle_available:
          default: false
          title: Bundle Available
          type: boolean
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        currency:
          anyOf:
          - type: string
          - type: 'null'
          title: Currency
        job_id:
          title: Job Id
          type: string
        status:
          title: Status
          type: string
        tier_billed:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier Billed
        units_total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Units Total
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      required:
      - job_id
      - status
      title: JobSummary
      type: object
    AudiogramLayout:
      enum:
      - square
      - portrait
      - landscape
      title: AudiogramLayout
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    ModerationCheck:
      enum:
      - sexual
      - violence
      - dangerous
      title: ModerationCheck
      type: string
    PrivacyRedactionStyle:
      enum:
      - blur
      - pixelate
      - solid
      title: PrivacyRedactionStyle
      type: string
    PlaceholderConfig:
      properties:
        lqip_max_bytes:
          default: 4096
          maximum: 16384.0
          minimum: 256.0
          title: Lqip Max Bytes
          type: integer
        lqip_quality:
          default: 50
          maximum: 100.0
          minimum: 1.0
          title: Lqip Quality
          type: integer
        max_dimension:
          default: 32
          maximum: 100.0
          minimum: 8.0
          title: Max Dimension
          type: integer
        source_time_sec:
          default: 0.0
          maximum: 604800.0
          minimum: 0.0
          title: Source Time Sec
          type: number
      title: PlaceholderConfig
      type: object
    TranscodeOutput:
      properties:
        animation:
          anyOf:
          - $ref: '#/components/schemas/AnimationConfig'
          - type: 'null'
        audio:
          anyOf:
          - $ref: '#/components/schemas/AudioOptions'
          - type: 'null'
        audiogram:
          anyOf:
          - $ref: '#/components/schemas/AudiogramConfig'
          - type: 'null'
        contact_sheet:
          anyOf:
          - $ref: '#/components/schemas/ContactSheetConfig'
          - type: 'null'
        gif_preview:
          anyOf:
          - $ref: '#/components/schemas/GifPreviewConfig'
          - type: 'null'
        images:
          anyOf:
          - items:
              $ref: '#/components/schemas/ImageRendition'
            maxItems: 50
            type: array
          - type: 'null'
